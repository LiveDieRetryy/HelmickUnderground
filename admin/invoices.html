<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Invoice Management - Helmick Underground</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sidebar.css">
    <script src="shared-navbar.js"></script>
    <script src="utils.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            min-height: 100vh;
        }

        .main-content {
            margin-left: 280px;
            padding: 3rem;
            min-height: 100vh;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 5rem 1rem 2rem;
            }
        }

        .page-header {
            background: linear-gradient(135deg, 
                rgba(255, 107, 26, 0.15) 0%, 
                rgba(255, 107, 26, 0.08) 50%,
                rgba(255, 107, 26, 0.15) 100%);
            border-radius: 20px;
            padding: 2rem 3rem;
            margin-bottom: 3rem;
            border: 2px solid rgba(255, 107, 26, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(255, 107, 26, 0.1);
        }

        .page-header h1 {
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 2rem;
            margin: 0;
        }

        .btn-create {
            background: linear-gradient(135deg, var(--primary-color) 0%, #ff8c42 100%);
            color: var(--white);
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 26, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            z-index: 10;
        }

        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 26, 0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-dark);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid rgba(255, 107, 26, 0.3);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(255, 107, 26, 0.2);
            border-color: var(--primary-color);
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
        }

        .stat-value {
            color: var(--primary-color);
            font-size: 2.5rem;
            font-weight: 900;
        }

        .invoices-container {
            background: var(--card-dark);
            border-radius: 20px;
            padding: 2.5rem;
            border: 2px solid rgba(255, 107, 26, 0.3);
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
            }
            
            .filter-input,
            .filter-select {
                width: 100%;
                min-width: 100%;
            }
        }

        .filter-input {
            background: rgba(255, 107, 26, 0.1);
            border: 1px solid rgba(255, 107, 26, 0.3);
            color: var(--white);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            flex: 1;
            min-width: 200px;
        }

        .filter-select {
            background: rgba(255, 107, 26, 0.1);
            border: 1px solid rgba(255, 107, 26, 0.3);
            color: var(--white);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-select option {
            background: #1a1a1a;
            color: var(--white);
            padding: 0.75rem;
            font-weight: 600;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 26, 0.2);
        }

        .retainage-status-select {
            width: 100%;
            max-width: 150px;
            margin-top: 0.35rem;
            padding: 0.35rem 1.6rem 0.35rem 0.5rem;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 107, 26, 0.35);
            border-radius: 6px;
            color: var(--white);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
        }

        .retainage-status-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(255, 107, 26, 0.18);
        }

        .retainage-status-select option {
            background: #1a1a1a;
            color: var(--white);
        }

        .invoices-table {
            width: 100%;
            border-collapse: collapse;
        }

        .invoices-table th {
            color: var(--gray);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid rgba(255, 107, 26, 0.3);
        }

        .invoices-table td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid rgba(255, 107, 26, 0.1);
            color: var(--white);
        }

        .invoices-table tr:hover {
            background: rgba(255, 107, 26, 0.05);
        }

        .invoice-number {
            color: var(--primary-color);
            font-weight: 700;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-paid {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .status-overdue {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .status-draft {
            background: rgba(100, 100, 100, 0.2);
            color: var(--gray);
            border: 1px solid rgba(100, 100, 100, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            background: rgba(255, 107, 26, 0.1);
            border: 1px solid rgba(255, 107, 26, 0.3);
            color: var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-action:hover {
            background: var(--primary-color);
            color: var(--white);
        }

        .invoice-actions-toggle {
            width: 44px;
            padding: 0;
            background: rgba(255, 107, 26, 0.1);
            border: 1px solid rgba(255, 107, 26, 0.4);
            border-radius: 8px;
            color: var(--primary-color);
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
        }

        .invoice-actions-menu {
            position: fixed;
            z-index: 11000;
            min-width: 150px;
            padding: 0.4rem;
            background: #1b1b1b;
            border: 1px solid rgba(255, 107, 26, 0.45);
            border-radius: 8px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
        }

        .invoice-actions-menu button {
            display: block;
            width: 100%;
            min-height: 38px;
            padding: 0.55rem 0.75rem;
            background: transparent;
            border: 0;
            border-radius: 6px;
            color: var(--white);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: left;
        }

        .invoice-actions-menu button:hover {
            background: rgba(255, 107, 26, 0.16);
        }

        .invoice-actions-menu .invoice-delete-action {
            color: #f87171;
        }

        .invoice-card-summary {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
        }

        .empty-state h3 {
            color: var(--white);
            margin-bottom: 1rem;
        }

        /* Use cards before the sidebar makes the desktop table too narrow. */
        @media (max-width: 1500px) {
            .invoices-table {
                display: block;
            }
            
            .invoices-table thead {
                display: none;
            }
            
            .invoices-table tbody {
                display: block;
            }
            
            .invoices-table tr {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.85rem 1.5rem;
                background: rgba(255, 107, 26, 0.05);
                border: 1px solid rgba(255, 107, 26, 0.3);
                border-radius: 12px;
                padding: 1.15rem 1.25rem;
                margin-bottom: 1rem;
            }
            
            .invoices-table td {
                display: block;
                padding: 0;
                border: none;
            }
            
            .invoices-table td::before {
                content: attr(data-label);
                display: block;
                margin-bottom: 0.35rem;
                font-weight: 700;
                color: var(--primary-color);
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            .invoice-cell-value {
                min-width: 0;
                overflow-wrap: anywhere;
                color: var(--white);
                font-size: 0.95rem;
                font-weight: 600;
                text-align: left;
            }

            .retainage-status-select {
                max-width: 150px;
            }

            .invoice-cell-identity {
                grid-column: 1 / -1;
                padding-bottom: 0.85rem !important;
                border-bottom: 1px solid rgba(255, 107, 26, 0.2) !important;
            }

            .invoice-cell-identity::before {
                display: none !important;
            }

            .invoice-cell-identity .invoice-cell-value {
                color: var(--primary-color);
                font-size: 1.05rem;
                font-weight: 800;
            }

            .invoice-card-collapsed {
                display: block;
                cursor: pointer;
                padding: 0.9rem 1.1rem;
            }

            .invoice-card-collapsed > td:not(.invoice-cell-identity) {
                display: none;
            }

            .invoice-card-collapsed .invoice-cell-identity {
                position: relative;
                padding-right: 2rem !important;
            }

            .invoice-card-collapsed .invoice-cell-identity::after {
                content: '⌄';
                position: absolute;
                top: 50%;
                right: 0;
                color: var(--primary-color);
                font-size: 1.5rem;
                transform: translateY(-50%);
            }

            .invoice-card-collapsed .invoice-card-summary {
                display: block;
                margin-top: 0.35rem;
                color: var(--gray);
                font-size: 0.82rem;
                font-weight: 500;
                overflow-wrap: anywhere;
            }

            .invoices-table tr:not(.invoice-card-collapsed) .invoice-cell-identity::after {
                content: '⌃';
                position: absolute;
                top: 1rem;
                right: 0;
                color: var(--primary-color);
                font-size: 1.5rem;
            }

            .invoices-table tr:not(.invoice-card-collapsed) .invoice-cell-identity {
                position: relative;
                padding-right: 2rem !important;
            }

            .invoice-cell-amount .invoice-cell-value,
            .invoice-cell-retainage .invoice-cell-value {
                font-size: 1.05rem;
            }

            .invoice-cell-retainage .invoice-cell-value {
                color: #fca5a5;
            }
            
            .invoices-table tr:hover {
                background: rgba(255, 107, 26, 0.1);
            }
            
            .invoice-cell-status .invoice-cell-value,
            .invoice-cell-actions .invoice-cell-value {
                display: flex;
                align-items: center;
            }

            .invoice-cell-status .status-select {
                min-width: 140px;
            }

            @media (max-width: 650px) {
                .invoices-table tr {
                    grid-template-columns: 1fr;
                    gap: 0.9rem;
                    padding: 1.1rem;
                }

                .invoice-cell-status,
                .invoice-cell-actions {
                    padding-top: 0.75rem !important;
                    border-top: 1px solid rgba(255, 107, 26, 0.16) !important;
                }

                .invoice-cell-status .status-select,
                .retainage-status-select {
                    width: 100%;
                    max-width: none;
                }

                .invoice-cell-actions .invoice-cell-value {
                    justify-content: flex-start;
                }
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <div class="mobile-menu-toggle" id="mobileMenuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <div class="main-content">
        <div class="page-header">
            <h1><span>🧾</span> Invoice Management</h1>
            <a href="create-invoice.html" class="btn-create">
                <span>➕</span>
                <span>Create Invoice</span>
            </a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Invoices</div>
                <div class="stat-value" id="totalInvoices">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-value" id="totalRevenue">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending Amount</div>
                <div class="stat-value" id="pendingAmount">$0</div>
                <div id="pendingRetainage" style="color: #ef4444; font-size: 0.8rem; font-weight: 600; margin-top: 0.35rem;">Retainage: $0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Overdue</div>
                <div class="stat-value" id="overdueCount">0</div>
            </div>
        </div>

        <div class="invoices-container">
            <div class="filter-bar">
                <input type="text" id="searchInput" class="filter-input" placeholder="Search invoices...">
                <select id="statusFilter" class="filter-select">
                    <option value="all">All Status</option>
                    <option value="draft">Draft</option>
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="overdue">Overdue</option>
                </select>
            </div>

            <div id="invoicesList">
                <table class="invoices-table">
                    <thead>
                        <tr>
                            <th>Invoice #</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Due Date</th>
                            <th>Amount</th>
                            <th>Retainage</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesTableBody">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 2rem; color: var(--gray);">
                                Loading invoices...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" onclick="if(event.target === this) closeDeleteModal()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 10000; align-items: center; justify-content: center;">
        <div style="background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); border-radius: 16px; padding: 2rem; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 107, 26, 0.3);">
            <h2 style="color: var(--primary-color); margin: 0 0 1rem 0; font-size: 1.5rem;">Confirm Delete</h2>
            <p style="color: var(--white); margin: 0 0 2rem 0; line-height: 1.6;">Are you sure you want to delete this invoice? This action cannot be undone.</p>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button onclick="closeDeleteModal()" style="background: #6b7280; color: white; padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
                    Cancel
                </button>
                <button id="confirmDeleteBtn" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);">
                    Delete Invoice
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="auth.js"></script>
    <script src="sidebar.js"></script>
    <script src="invoice-template.js"></script>
    <script src="invoices.js"></script>
</body>
</html>">
